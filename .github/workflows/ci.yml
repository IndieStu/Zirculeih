name: Deelvo accounts and PostgreSQL integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-14
      - name: Check documentation
        run: python3 scripts/verify_docs.py
      - name: Repository secret patterns and locked SBOM
        run: |
          python3 scripts/secret_check.py
          python3 scripts/security_inventory.py --sbom /tmp/deelvo-python-sbom.cdx.json --audit /tmp/deelvo-package-audit.json
      - name: Create disposable development configuration
        run: python3 scripts/dev_env.py
      - name: Validate and build Compose
        run: |
          docker compose config --quiet
          docker compose build web test
      - name: Lint and types
        run: |
          docker compose run --rm test python -m ruff check .
          docker compose run --rm test python -m ruff format --check .
          docker compose run --rm test python -m mypy
      - name: Model and configuration checks
        run: |
          docker compose run --rm test python backend/manage.py check
          docker compose run --rm test python backend/manage.py makemigrations --check --dry-run
      - name: PostgreSQL integration and concurrency
        run: docker compose run --rm test python -m pytest --junitxml=/tmp/results.xml
      - name: Bootstrap and health smoke test
        run: |
          docker compose run --rm migrate
          docker compose run --rm static
          docker compose up -d --wait web
          curl --fail --retry 3 http://localhost:8000/health/live/
          curl --fail --retry 3 http://localhost:8000/health/ready/
          curl --fail http://localhost:8000/
      - name: Effective unprivileged runtime checks
        run: python3 scripts/runtime_security_probe.py
      - name: Isolated review deployment and explicit seed
        run: |
          python3 scripts/review_env.py --url http://localhost:8766 --build "$(git rev-parse HEAD)"
          scripts/review-deploy
          scripts/review-stack exec -T web python backend/manage.py seed_review_data
          scripts/review-stack exec -T web python backend/manage.py seed_review_data
          scripts/review-stack exec -T web python backend/manage.py enhance_review_ux
          scripts/review-stack exec -T web python backend/manage.py enhance_review_ux
          scripts/review-stack exec -T web python backend/manage.py enhance_review_calendar
          scripts/review-stack exec -T web python backend/manage.py enhance_review_calendar
          scripts/review-stack exec -T web python backend/manage.py enhance_review_phase7
          scripts/review-stack exec -T web python backend/manage.py enhance_review_phase7
          scripts/review-stack exec -T web python backend/manage.py review_identifiers
          curl --fail http://localhost:8766/ | grep TESTINSTANZ
          curl --fail http://localhost:8766/static/brand.css
          scripts/review-stack exec -T web python backend/manage.py shell -c "from django.conf import settings; from django.core.mail import send_mail; from pathlib import Path; assert settings.EMAIL_BACKEND == 'django.core.mail.backends.filebased.EmailBackend'; send_mail('Fictional review smoke', 'No delivery', None, ['fictional@example.test']); assert list(Path(settings.EMAIL_FILE_PATH).glob('*'))"
      - name: Native PostgreSQL encrypted backup and isolated restore drill
        run: |
          python3 -m venv /tmp/deelvo-ops-venv
          /tmp/deelvo-ops-venv/bin/python -m pip install --require-hashes -r requirements.lock
          /tmp/deelvo-ops-venv/bin/python scripts/restore_drill.py --adapter compose --confirm-disposable --output /tmp/phase-12-restore.json
      - name: Bounded fictional catalog load probe
        run: python3 scripts/load_probe.py --url http://localhost:8766/entdecken/ --requests 60 --concurrency 8 --output /tmp/phase-12-load.json
      - name: Runtime image security and package inventory
        run: |
          python3 scripts/fetch_audit_tool.py --destination /tmp/deelvo-tools/trivy
          python3 scripts/container_audit.py --scanner /tmp/deelvo-tools/trivy --output /tmp/phase-12-container.json
          DATABASE_IMAGE=$(python3 -c 'import json; d=next(i for i in json.load(open("docs/release/container-images.json"))["images"] if i["repository"].endswith("/postgres")); print("postgres:"+d["tag"]+"@"+d["digest"])')
          python3 scripts/container_audit.py --scanner /tmp/deelvo-tools/trivy --image "$DATABASE_IMAGE" --output /tmp/phase-12-database-container.json
      - name: Disposable cleanup
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          if [ -f .env.review ]; then scripts/review-stack down --volumes --remove-orphans; fi
